name: Build Study App APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Android Files
        run: |
          mkdir -p app/src/main/assets app/src/main/res/drawable app/src/main/java/com/study/myapp
          cp index.html app/src/main/assets/index.html
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AmarStudyApp"
          include ':app'
          EOF
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.7.2' apply false
          }
          EOF
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.study.myapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.study.myapp"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_app"
                  android:label="আমার স্টাডি অ্যাপ"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".AlarmReceiver" android:exported="false" />
              </application>
          </manifest>
          EOF
          cat << 'EOF' > app/src/main/res/drawable/ic_app.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#1D4ED8"
                  android:pathData="M18,2H6C4.9,2 4,2.9 4,4v16c0,1.1 0.9,2 2,2h12c1.1,0 2,-0.9 2,-2V4C20,2.9 19.1,2 18,2zM6,4h5v8l-2.5,-1.5L6,12V4z"/>
          </vector>
          EOF
          cat << 'EOF' > app/src/main/java/com/study/myapp/AlarmReceiver.java
          package com.study.myapp;
          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioAttributes;
          import android.media.RingtoneManager;
          import android.net.Uri;
          import android.os.Build;
          import java.util.Calendar;
          public class AlarmReceiver extends BroadcastReceiver {
              private static final String CHANNEL_ID = "study_channel_id";
              @Override
              public void onReceive(Context context, Intent intent) {
                  int id = intent.getIntExtra("id", 1);
                  String title = intent.getStringExtra("title");
                  String message = intent.getStringExtra("message");
                  boolean isDaily = intent.getBooleanExtra("isDaily", false);
                  int hour = intent.getIntExtra("hour", 8);
                  int minute = intent.getIntExtra("minute", 0);
                  if (title == null) title = "পড়াশোনার সময়!";
                  if (message == null) message = "রুটিন অনুযায়ী এখন পড়ার সময় হয়েছে।";
                  NotificationManager nm = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  Uri soundUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && nm != null) {
                      NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "Study Reminders", NotificationManager.IMPORTANCE_HIGH);
                      AudioAttributes attr = new AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_NOTIFICATION).build();
                      channel.setSound(soundUri, attr);
                      channel.enableVibration(true);
                      nm.createNotificationChannel(channel);
                  }
                  Intent openIntent = new Intent(context, MainActivity.class);
                  openIntent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent contentPi = PendingIntent.getActivity(context, id, openIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification.Builder builder = (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                      ? new Notification.Builder(context, CHANNEL_ID) : new Notification.Builder(context);
                  builder.setSmallIcon(R.drawable.ic_app).setContentTitle(title).setContentText(message).setAutoCancel(true).setContentIntent(contentPi);
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) { builder.setSound(soundUri); builder.setDefaults(Notification.DEFAULT_ALL); }
                  if (nm != null) nm.notify(id, builder.build());
                  if (isDaily) scheduleDailyAlarm(context, id, title, message, hour, minute);
              }
              public static void scheduleDailyAlarm(Context context, int id, String title, String message, int hour, int minute) {
                  AlarmManager am = (AlarmManager) context.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;
                  Calendar cal = Calendar.getInstance();
                  cal.set(Calendar.HOUR_OF_DAY, hour); cal.set(Calendar.MINUTE, minute);
                  cal.set(Calendar.SECOND, 0); cal.set(Calendar.MILLISECOND, 0);
                  if (cal.getTimeInMillis() <= System.currentTimeMillis()) cal.add(Calendar.DAY_OF_YEAR, 1);
                  Intent intent = new Intent(context, AlarmReceiver.class);
                  intent.putExtra("id", id); intent.putExtra("title", title); intent.putExtra("message", message);
                  intent.putExtra("isDaily", true); intent.putExtra("hour", hour); intent.putExtra("minute", minute);
                  PendingIntent pi = PendingIntent.getBroadcast(context, id, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.getTimeInMillis(), pi);
              }
          }
          EOF
          cat << 'EOF' > app/src/main/java/com/study/myapp/MainActivity.java
          package com.study.myapp;
          import android.Manifest;
          import android.app.Activity;
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQ = 101;
              private static final int TIMER_NOTIF_ID = 99999;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 102);
                  }
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true); ws.setDomStorageEnabled(true); ws.setDatabaseEnabled(true);
                  ws.setAllowFileAccess(true); ws.setAllowContentAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView vw, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = callback;
                          try { startActivityForResult(params.createIntent(), FILE_CHOOSER_REQ); }
                          catch (Exception e) { filePathCallback = null; return false; }
                          return true;
                      }
                  });
                  webView.addJavascriptInterface(new StudyBridge(), "AndroidApp");
                  webView.loadUrl("file:///android_asset/index.html");
              }
              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_REQ && filePathCallback != null) {
                      filePathCallback.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data));
                      filePathCallback = null;
                  } else { super.onActivityResult(requestCode, resultCode, data); }
              }
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
              public class StudyBridge {
                  @JavascriptInterface
                  public void scheduleDailyNotification(int id, String title, String message, int hour, int minute) {
                      AlarmReceiver.scheduleDailyNotification(MainActivity.this, id, title, message, hour, minute);
                      runOnUiThread(() -> Toast.makeText(MainActivity.this, "✅ প্রতিদিন " + String.format("%02d:%02d", hour, minute) + " এ নোটিফিকেশন সেট হয়েছে!", Toast.LENGTH_SHORT).show());
                  }
                  @JavascriptInterface
                  public void scheduleTimerNotification(int seconds, String title, String message) {
                      AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                      if (am == null) return;
                      Intent intent = new Intent(MainActivity.this, AlarmReceiver.class);
                      intent.putExtra("id", TIMER_NOTIF_ID); intent.putExtra("title", title);
                      intent.putExtra("message", message); intent.putExtra("isDaily", false);
                      PendingIntent pi = PendingIntent.getBroadcast(MainActivity.this, TIMER_NOTIF_ID, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, System.currentTimeMillis() + (seconds * 1000L), pi);
                  }
                  @JavascriptInterface
                  public void cancelTimerNotification() {
                      AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                      if (am == null) return;
                      Intent intent = new Intent(MainActivity.this, AlarmReceiver.class);
                      PendingIntent pi = PendingIntent.getBroadcast(MainActivity.this, TIMER_NOTIF_ID, intent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      am.cancel(pi);
                  }
              }
          }
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms/android-34 build-tools/34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmarStudyApp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
